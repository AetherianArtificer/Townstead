modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"

[[mixins]]
config = "townstead.mixins.json"

[[mods]]
modId = "townstead"
version = "${version}"
displayName = "Townstead"
authors = "AetherianArtificer"
description = '''An unofficial expansion for MCA Reborn with additional villager needs, buildings, jobs, and mod integrations.'''
logoFile = "townstead-title-hd.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/townstead"

[modproperties.townstead]
catalogueImageIcon = "townstead-title-square-hd.png"

[[dependencies.townstead]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.townstead]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.townstead]]
modId = "mca"
type = "required"
# Accept the current release line and later MCA builds. The 1.21.1-SNAPSHOT dev build versions
# below 7.x, so it needs its own ascending, non-overlapping range entry.
versionRange = "[1.21.1-SNAPSHOT],[7.7.36-beta.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.townstead]]
modId = "patchouli"
type = "required"
versionRange = "[1.21.1-93,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.townstead]]
modId = "travelerstitles"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.townstead]]
modId = "butchery"
